plugins {
    id 'com.android.application'
}

// The city's photos and sky come from quest/tools/fetch_assets.py, not from git.
def cityAssets = file('src/main/assets/city/sky.hdr')
tasks.register('checkCityAssets') {
    doLast {
        if (!cityAssets.exists())
            throw new GradleException('The city\'s textures are missing: run  python3 quest/tools/fetch_assets.py  first.')
    }
}
preBuild.dependsOn 'checkCityAssets'

android {
    namespace 'io.github.spidy.citylab'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.spidy.citylab'
        minSdk 29
        targetSdk 32 // Quest OS: Android 12L
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Side-loaded, never published: the debug key signs it too.
            signingConfig signingConfigs.debug
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.4'
        }
    }
    buildFeatures {
        prefab true
    }
    androidResources {
        // The photos are JPEG already, the sky a compact HDR: store, don't squeeze.
        noCompress 'jpg', 'hdr'
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.49'
}
